# runbooks/restore-service.yml — restore a downed service from known-good state.
#
# Run:  ansible-playbook workspace/runbooks/restore-service.yml \
#           -e service_name=sdc-svc-ab -e golden_root=/opt/sdc/known-good
#
# ARIA breaks TWO different services TWO different ways (Phase 4) — one unit
# corrupted, one deleted — then runs THIS runbook against each. Both must come
# back: active, enabled, and serving their known-good content, on every node.
# A `systemctl restart` fixes neither (you cannot restart a corrupt/missing unit);
# you must RECONCILE the unit from the golden store. Idempotent: a re-run of an
# already-healthy service makes zero changes.
#
# Known-good store layout:  {{ golden_root }}/{{ service_name }}.service
# Install target:           /etc/systemd/system/{{ service_name }}.service
- name: Restore a scored service from known-good state
  hosts: fleet
  become: true
  tasks:
    - name: Require a service name and a golden store
      ansible.builtin.assert:
        that:
          - service_name is defined and service_name | length > 0
          - golden_root is defined and golden_root | length > 0
        fail_msg: "Pass -e service_name=<svc> -e golden_root=<dir>"

    # TODO: copy the known-good unit into place, reload systemd only when the unit
    # changed (use a handler so re-runs stay idempotent), then enable + start it.
    # Hints:
    #   ansible.builtin.copy: remote_src=true
    #     src="{{ golden_root }}/{{ service_name }}.service"
    #     dest="/etc/systemd/system/{{ service_name }}.service"
    #     -> notify a "reload systemd" handler (ansible.builtin.systemd: daemon_reload=true)
    #   ansible.builtin.systemd: name="{{ service_name }}" enabled=true state=started
    - name: TODO — reconcile and start the service
      ansible.builtin.debug:
        msg: "Replace me: restore {{ service_name }} from {{ golden_root }}."

