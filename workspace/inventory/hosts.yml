# The fleet you respond on. Pre-registered — this mission is about writing
# reusable response runbooks, not building the inventory. Your runbooks target
# the `fleet` group and must work against every node in it, with no host
# singled out and no address hardcoded.
all:
  children:
    fleet:
      hosts:
        sdc-web:
          ansible_host: localhost
          ansible_port: 2221
        sdc-db:
          ansible_host: localhost
          ansible_port: 2222
        sdc-comms:
          ansible_host: localhost
          ansible_port: 2223
